# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-prepare-rpgp"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-prepare-rpgp"
description = "The rpgp OpenPGP engine: a Stream decrypted, encrypted, signed and verified as it streams, keys from files, nothing looked up over a network. A xmip-core-prepare technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability (repository-model.md): the
# engine trait it implements is prepare's.
prepare = { package = "xmip-core-prepare", git = "https://github.com/IlleNilsson/xmip-core-prepare", branch = "main" }
# OpenPGP in Rust, MIT or Apache-2.0, streamed; without bzip2, which binds
# a C library and which Xmip's own Compression does not take either.
pgp = { version = "0.21", default-features = false }
# The randomness rpgp draws its session keys and nonces from: the operating
# system's, through rand's thread generator, the version rpgp takes.
rand = "0.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
